  <style>
    :root {
      --bg: #e6e7e8;
      --ink: #3B403E;
      --accent: #8C2108;
      --card: #ffffff;
    }
    :root { color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c1e;
        --ink: #e6e7e8;
        --accent: #f07c5c;
        --card: #26282b;
      }
      header img { filter: invert(1) hue-rotate(180deg); }
      .card { box-shadow: 0 1px 2px rgba(0,0,0,.5); }
      .card:hover, .card:focus-visible { box-shadow: 0 12px 28px rgba(0,0,0,.6); }
    }
    @view-transition { navigation: auto; }
    ::view-transition-group(root) { animation-duration: .35s; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Roboto', Arial, sans-serif;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px 32px;
      margin-bottom: 40px;
    }
    header img {
      display: block;
      width: 280px;
      max-width: 100%;
      height: auto;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--accent);
      line-height: 1;
    }
    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .card {
      display: block;
      height: 100%;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .media {
      position: relative;
      display: block;
      aspect-ratio: 4 / 3;
    }
    .media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .media img.cover { object-fit: cover; }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: 700;
      color: rgba(255,255,255,.12);
    }
    .badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: .8rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .year {
      display: block;
      padding: 14px 18px 16px;
      font-size: 1.75rem;
      font-weight: 700;
    }
    .card:hover .year { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:focus-visible { transform: none; }
    }
    @media (max-width: 600px) {
      .wrap { padding: 32px 16px 48px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .year { font-size: 1.25rem; padding: 10px 12px 12px; }
      .badge { left: 8px; bottom: 8px; font-size: .7rem; }
    }
  </style>
</head>
