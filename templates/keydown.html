<script>document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;var a=document.querySelector(e.key==='ArrowLeft'?'.year-arrow.prev':e.key==='ArrowRight'?'.year-arrow.next':null);if(a)location.href=a.href;});</script>
